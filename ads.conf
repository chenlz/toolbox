; =======================================================
; Ad-Block - Quantumult X
; 虎扑 App 8.2.58 / B站 HAR 2026-10-29 / 微博轻享版 / 更新 2026-11-10
; =======================================================

; 配置片段：将三个节合并进主配置同名节，勿覆盖已有证书或 hostname。
; 不是可直接添加到 [rewrite_remote] 的单一重写订阅。
; HTTPS 重写需启用 MitM、安装并信任自己的 CA 证书。

[rewrite_local]

; --- 虎扑广告请求 ---
^https?://goblin\.hupu\.com/\d+/[\d.]+/(?:interfaceAd/getOther/(?:v3|batch)|toutiao/app|config/app)(?:\?.*)?$ url reject-dict
^https?://goblin\.hupu\.com/\d+/[\d.]+/config/reportppas(?:\?.*)?$ url reject-200
^https?://(?:goblin\.hupu\.com/\d+/[\d.]+/reward-free-ad/popup|bbs\.mobileapi\.hupu\.com/\d+/[\d.]+/bbsallapi/event/v1/getAllPopupCmd)(?:\?.*)?$ url reject-dict
^https?://hss\.hupu\.com/kaleido/hss/authKey/generateToken(?:\?.*)?$ url reject-dict

; --- 虎扑广告监控 / 竞价上报 ---
^https?://e-goblin\.hupu\.com/(?:bm|cm|rm|wm|pm|dm|cacheWin|newFilter)(?:\?.*)?$ url reject

; --- 京东 / 美团联盟广告上报 ---
^https?://(?:im-x\.jd\.com/dsp/(?:np|cl)|impdsp\.meituan\.com/notice|clickdsp\.meituan\.com/dsp)(?:\?.*)?$ url reject

; --- 哔哩哔哩：精确开屏接口，保留播放器 / 弹幕 / 登录 / 直播 / 商城 ---
; HAR 中开屏响应为 {}；沿用空对象拦截，不能据此证明所有客户端版本兼容。
^https?://app\.bili(?:bili\.com|api\.net)/x/v2/splash/(?:show|list|elected|brand/list|event/list2)(?:\?.*)?$ url reject-dict
^https?://app\.bili(?:bili\.com|api\.net)/x/v2/splash/report(?:\?.*)?$ url reject-200

; 首页：仅清除已在 HAR 确认的 banner_v8 内 type=ad 且 is_ad=true 的子项。
; is_ad_loc 仅表示广告位；保留 static_banner、普通视频、直播卡及未知结构。
; 让原始响应通过并过滤 JSON，不直接拒绝整个首页接口。
^https?://app\.bili(?:bili\.com|api\.net)/x/v2/feed/index(?:\?.*)?$ url jsonjq-response-body '. as $original | try (if .code == 0 and (.data.items | type) == "array" then .data.items |= map(if .card_type == "banner_v8" and .card_goto == "banner" and (.banner_item | type) == "array" then .banner_item |= map(select(.type != "ad" or (.ad_banner | type) != "object" or .ad_banner.is_ad != true)) else . end) else . end) catch $original'

; HAR 中 39 次转化上报 + 9 次计费上报；替代原先整个 /cm/api/ 的宽泛拦截。
^https?://cm\.bilibili\.com/cm/api/(?:conversion/mobile/v2|fees/wise)(?:\?.*)?$ url reject-dict

; 可选：素材 / 第三方归因，默认关闭，避免干扰用户主动打开的推广、游戏或商城内容。
; ^https?://upos-sz-static\.bilivideo\.com/ssaxcode/.*SPLASH.* url reject-200
; ^https?://i[0-9]\.hdslb\.com/bfs/(?:sycp_brand/|sycp/(?:mgk/material/|mng/|sanlian/image/)) url reject-200
; ^https?://game-attribute\.biligame\.com/ad/api/click(?:\?.*)?$ url reject-dict
; ^https?://api\.iegadp\.qq\.com/iegadp/api/ocpa/(?:Expose|Click)Report(?:\?.*)?$ url reject-dict
; 不拦截 dataflow.biliapi.com、data.bilibili.com，也不处理 gRPC / protobuf。

; --- 微博轻享版：移除趋势页横幅、常看的人和尊享会员入口 ---
^https://weibointl\.api\.weibo\.cn/portal\.php\?(?:[^&#]*&)*a=trends(?:&|$) url jsonjq-response-body 'if type == "object" and (.data | type) == "object" then .data |= (del(.banner, .profile_accessrecord) | if (.discover | type) == "array" then .discover |= map(select(type != "object" or (.schema != "尊享会员" and .title != "尊享会员"))) else . end) else . end'


[filter_local]

host-suffix,ccdace.hupu.com,reject
host-suffix,e-goblin.hupu.com,reject
host-suffix,impdsp.meituan.com,reject
host-suffix,clickdsp.meituan.com,reject
host-suffix,im-x.jd.com,reject


[mitm]

hostname = goblin.hupu.com, bbs.mobileapi.hupu.com, hss.hupu.com, app.bilibili.com, app.biliapi.net, cm.bilibili.com, weibointl.api.weibo.cn

